version: "3.9"

services:
  db:
    image: postgres:16.3-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    volumes:
      - userservice:/var/lib/postgresql/data
    restart: always
  backend:
    build: .
    container_name: userService
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: always

volumes:
  userservice:
